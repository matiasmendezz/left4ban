<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;600&family=Roboto+Mono:wght@400;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="lang-switcher">
        <button type="button" class="lang-btn" data-lang="es">ES</button>
        <button type="button" class="lang-btn" data-lang="en">EN</button>
    </div>

    <div class="container main-screen">
        <h1 class="glitch-text" data-text="LEFT 4 BAN">LEFT 4 BAN</h1>
        <p class="subtitle" data-i18n="subtitle">Verificador de Bans Multi-Fuente</p>

        <!-- Main Search Form -->
        <div class="search-box" id="search-container">
            <form id="u-form">
                <textarea id="steam-input" name="steam_input" rows="4"
                    data-i18n-attr="placeholder:placeholder"
                    placeholder="Pegue SteamID, URL de perfil, STEAM_1:X:Y, [U:1:X] o el texto completo del comando 'status' de la consola..."
                    required></textarea>
                <button type="submit" class="btn-scan" id="btn-submit" data-i18n="scan_btn">ESCANEAR INFECCIÓN</button>
            </form>
        </div>

        <!-- Compact New Search Button (shown during/after scan) -->
        <div id="new-search-container" style="display: none; margin-bottom: 25px;">
            <a href="/" class="btn-scan" id="btn-new-search" data-i18n="new_search"
                style="display: inline-block; padding: 10px 25px; font-size: 1.2rem; width: auto; background-color: #d32f2f; text-decoration: none; border: 1px solid #ff4444; box-shadow: 0 0 10px rgba(211, 47, 47, 0.5);">
                &larr; NUEVA BÚSQUEDA
            </a>
        </div>

        <!-- Progress View (Hidden by default) -->
        <div class="progress-view" id="progress-view"
            style="display: none; text-align: center; background: rgba(0,0,0,0.8); padding: 30px; border: 1px solid #ff4444; border-radius: 8px; margin-bottom: 30px;">

            <!-- Dynamic Profile Info -->
            <div id="profile-info" style="margin-bottom: 20px; display: none;">
                <img id="profile-avatar" src="" alt="Avatar"
                    style="width: 80px; height: 80px; border-radius: 50%; border: 2px solid #fff; margin-bottom: 10px;">
                <h2 id="profile-name"
                    style="margin: 0; color: #fff; font-family: 'Teko', sans-serif; font-size: 2em; letter-spacing: 2px;">
                </h2>
                <p id="profile-analyzing-text" data-i18n="progress_analyzing" style="color: #bbb; margin: 5px 0;">Analizando historial de bans...</p>
            </div>

            <h3 id="status-text" data-status-key="status_starting" style="color: #ff4444; margin-top: 0; display: block;">INICIANDO ESCANEO...</h3>

            <ul id="progress-list"
                style="list-style: none; padding: 0; text-align: left; max-width: 500px; margin: 0 auto; border-top: 1px solid #444; padding-top: 20px;">
                <!-- Items added by JS -->
            </ul>
        </div>

        <!-- Lobby Summary Bar (Hidden initially until first result) -->
        <div class="lobby-toolbar" id="lobby-toolbar" style="display: none;">
            <div class="lobby-counters">
                <span class="counter-pill pill-total">Total: <span id="count-total">0</span></span>
                <span class="counter-pill pill-banned">🔴 <span data-i18n="counter_banned">Baneados</span>: <span id="count-banned">0</span></span>
                <span class="counter-pill pill-warning">🟡 <span data-i18n="counter_leavers">Leavers</span>: <span id="count-warning">0</span></span>
                <span class="counter-pill pill-smurf">🔗 <span data-i18n="counter_smurfs">Smurfs</span>: <span id="count-smurfs">0</span></span>
                <span class="counter-pill pill-clean">🟢 <span data-i18n="counter_clean">Limpios</span>: <span id="count-clean">0</span></span>
            </div>
            <div class="toolbar-actions">
                <button type="button" class="btn-tool" id="btn-toggle-autobans" data-i18n="toggle_autobans">Ocultar AutoBans Expirados</button>
                <button type="button" class="btn-tool" id="btn-copy-l4d2" data-i18n="copy_l4d2">📋 Copiar para Chat L4D2</button>
                <button type="button" class="btn-tool" id="btn-copy-discord" data-i18n="copy_discord">📋 Copiar para Discord</button>
            </div>
        </div>

        <!-- Live Results Queue -->
        <section class="players-container" id="live-results-queue" style="margin-top: 20px; text-align: left;"></section>

        {% if error %}
        <div class="error-msg">
            ⚠️ {{ error }}
        </div>
        {% endif %}

        <div class="sources-list" id="sources-list-footer">
            <span data-i18n="sources_label">Fuentes:</span>
            <ul>
                <li>SirPlease.net</li>
                <li>L4D2Center</li>
                <li>CedaPug</li>
            </ul>
        </div>
    </div>

                copy_discord: "📋 Copy for Discord"
            }

        let currentLang = 'es';
        let scannedPlayers = [];
        let hideAutobansActive = false;

        function copyToClipboard(text, btnEl) {
            if (!text) return;
            const originalText = btnEl ? btnEl.innerText : "";
            const showSuccess = () => {
                if (btnEl) {
                    btnEl.innerText = "✔";
                    setTimeout(() => {
                        btnEl.innerText = originalText;
                    }, 1500);
                }
            };

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(showSuccess).catch(err => {
                    console.error("Clipboard API error:", err);
                    fallbackCopy(text, showSuccess);
                });
            } else {
                fallbackCopy(text, showSuccess);
            }
        }

        function fallbackCopy(text, cb) {
            const ta = document.createElement("textarea");
            ta.value = text;
            ta.style.position = "fixed";
            ta.style.opacity = "0";
            document.body.appendChild(ta);
            ta.select();
            try {
                document.execCommand("copy");
                if (cb) cb();
            } catch (e) {
                console.error("Fallback copy failed", e);
            }
            document.body.removeChild(ta);
        }

        function formatStatus(status, lang) {
            if (!status) return '';
            const s = status.toLowerCase();
            if (s.includes('autoban')) {
                return I18N[lang].status_autoban;
            }
            if (s.includes('clean')) {
                return I18N[lang].status_clean;
            }
            if (s.includes('bann')) {
                return I18N[lang].status_banned;
            }
            if (s.includes('record') || s.includes('found')) {
                return I18N[lang].status_records;
            }
            return status;
        }

        function updateLobbyCounters(players) {
            if (!players) players = [];
            const total = players.length;
            let banned = 0;
            let warning = 0;
            let smurfs = 0;
            let clean = 0;

            players.forEach(p => {
                if (p.is_smurf) smurfs++;
                let hasBan = false;
                let hasWarning = false;
                (p.results || []).forEach(r => {
                    const st = (r.status || '').toLowerCase();
                    if (st.includes('bann') || st === 'found records') {
                        hasBan = true;
                    } else if (st.includes('autoban')) {
                        hasWarning = true;
                    }
                });

                if (hasBan) {
                    banned++;
                } else if (hasWarning) {
                    warning++;
                } else {
                    clean++;
                }
            });

            const elTotal = document.getElementById('count-total');
            const elBanned = document.getElementById('count-banned');
            const elWarning = document.getElementById('count-warning');
            const elSmurfs = document.getElementById('count-smurfs');
            const elClean = document.getElementById('count-clean');

            if (elTotal) elTotal.innerText = total;
            if (elBanned) elBanned.innerText = banned;
            if (elWarning) elWarning.innerText = warning;
            if (elSmurfs) elSmurfs.innerText = smurfs;
            if (elClean) elClean.innerText = clean;
        }

        function generateL4D2Report(players) {
            if (!players || players.length === 0) return "say [Left4Ban] No players scanned.";
            let bannedNames = [];
            let leaverNames = [];
            let cleanCount = 0;
            players.forEach(p => {
                const pName = p.player_name || p.steam_id;
                let banSrc = [];
                let isLeaver = false;
                (p.results || []).forEach(r => {
                    const st = (r.status || '').toLowerCase();
                    if (st.includes('bann') || st === 'found records') {
                        banSrc.push(r.source);
                    } else if (st.includes('autoban')) {
                        isLeaver = true;
                    }
                });
                if (banSrc.length > 0) {
                    bannedNames.push(`${pName} (${banSrc.join('+')})`);
                } else if (isLeaver) {
                    leaverNames.push(pName);
                } else {
                    cleanCount++;
                }
            });

            let parts = [`[Left4Ban] Lobby (${players.length}p):`];
            if (bannedNames.length > 0) {
                parts.push(`🔴 ${bannedNames.length} BANNED: ${bannedNames.join(', ')}`);
            }
            if (leaverNames.length > 0) {
                parts.push(`🟡 ${leaverNames.length} Leavers: ${leaverNames.join(', ')}`);
            }
            parts.push(`🟢 ${cleanCount} Clean`);
            return `say ${parts.join(' | ')}`;
        }

        function generateDiscordReport(players) {
            if (!players || players.length === 0) return "**[Left4Ban Report]** No players scanned.";
            let lines = [`**🛡️ Left 4 Ban — Lobby Report (${players.length} players)**\n`];
            players.forEach(p => {
                const name = p.player_name || 'Unknown';
                const id64 = p.steam_id;
                const smurfInfo = p.is_smurf ? ` *(Smurf linked to ${p.smurf_of_name || p.smurf_of})*` : '';
                let statusLine = '🟢 Clean';
                let banDetails = [];
                (p.results || []).forEach(r => {
                    const st = (r.status || '').toLowerCase();
                    if (st.includes('bann') || st === 'found records') {
                        banDetails.push(`🔴 **${r.source}**: ${r.details || r.status}`);
                    } else if (st.includes('autoban')) {
                        banDetails.push(`🟡 **${r.source}**: Expired AutoBan`);
                    }
                });
                if (banDetails.length > 0) {
                    statusLine = banDetails.join(' | ');
                }
                lines.push(`• **${name}** (\`${id64}\`)${smurfInfo}\n  └ ${statusLine}`);
            });
            return lines.join('\n');
        }

        function setLanguage(lang) {
            if (!I18N[lang]) lang = 'es';
            currentLang = lang;
            localStorage.setItem('l4b_lang', lang);
            document.documentElement.lang = lang;

            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.toggle('active', btn.getAttribute('data-lang') === lang);
            });

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (key === 'toggle_autobans') {
                    el.innerHTML = hideAutobansActive ? I18N[lang].toggle_autobans_show : I18N[lang].toggle_autobans_hide;
                } else if (I18N[lang] && I18N[lang][key]) {
                    el.innerHTML = I18N[lang][key];
                }
            });

            document.querySelectorAll('[data-i18n-attr]').forEach(el => {
                const parts = el.getAttribute('data-i18n-attr').split(':');
                const attr = parts[0];
                const key = parts[1];
                if (attr && key && I18N[lang] && I18N[lang][key]) {
                    el.setAttribute(attr, I18N[lang][key]);
                }
            });

            document.querySelectorAll('[data-i18n-status]').forEach(el => {
                const orig = el.getAttribute('data-original-status');
                el.innerText = formatStatus(orig, lang);
            });

            document.querySelectorAll('[data-i18n-details]').forEach(el => {
                const details = el.getAttribute('data-details');
                const count = parseInt(el.getAttribute('data-count') || '0', 10);
                if (details) {
                    el.innerText = details;
                } else if (count > 0) {
                    el.innerText = `${count} ${I18N[lang].records}`;
                } else {
                    el.innerText = I18N[lang].no_incidents;
                }
            });

            document.querySelectorAll('[data-i18n-smurf]').forEach(el => {
                const linked = el.getAttribute('data-smurf-of');
                if (linked) {
                    el.innerText = `${I18N[lang].smurf_badge} (${I18N[lang].linked_to} ${linked})`;
                } else {
                    el.innerText = I18N[lang].smurf_badge;
                }
            });

            if (statusText && statusText.getAttribute('data-status-key')) {
                const key = statusText.getAttribute('data-status-key');
                if (I18N[lang] && I18N[lang][key]) {
                    statusText.innerText = I18N[lang][key];
                }
            }

            const newSearchBtn = document.getElementById('btn-new-search');
            if (newSearchBtn) {
                newSearchBtn.href = '/?lang=' + lang;
            }

            try {
                const url = new URL(window.location);
                url.searchParams.set('lang', lang);
                window.history.replaceState({}, '', url);
            } catch (e) {}
        }

        const form = document.getElementById('u-form');
        const searchContainer = document.getElementById('search-container');
        const newSearchContainer = document.getElementById('new-search-container');
        const progressView = document.getElementById('progress-view');
        const progressList = document.getElementById('progress-list');
        const statusText = document.getElementById('status-text');
        const liveResultsQueue = document.getElementById('live-results-queue');
        const lobbyToolbar = document.getElementById('lobby-toolbar');

        // Profile Elements
        const profileInfo = document.getElementById('profile-info');
        const profileName = document.getElementById('profile-name');
        const profileAvatar = document.getElementById('profile-avatar');

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function createPlayerCard(player) {
            const section = document.createElement('div');
            section.className = 'player-section' + (player.is_smurf ? ' smurf-account' : '');

            let smurfBadgeHtml = '';
            if (player.is_smurf) {
                const linkedTo = player.smurf_of_name || player.smurf_of;
                const linkedAttr = linkedTo ? escapeHtml(linkedTo) : '';
                const linkedText = linkedTo ? ` (${I18N[currentLang].linked_to} ${escapeHtml(linkedTo)})` : '';
                smurfBadgeHtml = `<div class="smurf-badge" data-i18n-smurf data-smurf-of="${linkedAttr}">${I18N[currentLang].smurf_badge}${linkedText}</div>`;
            }

            const avatarHtml = player.avatar ? `<img src="${escapeHtml(player.avatar)}" alt="Avatar" style="width: 50px; height: 50px; border-radius: 50%; border: 2px solid #fff; margin-top: 5px;">` : '';
            const playerNameHtml = (player.player_name && player.player_name !== 'Unknown') ? `<h2 style="margin: 0; line-height: 1.2;"><span class="player-name">${escapeHtml(player.player_name)}</span></h2>` : '';

            let cardsHtml = '';
            for (const item of (player.results || [])) {
                const stLower = (item.status || '').toLowerCase();
                let cardClass = 'banned';
                if (stLower === 'clean' || stLower === 'clean (api checked)') {
                    cardClass = 'clean';
                } else if (stLower.includes('autoban')) {
                    cardClass = 'warning';
                }
                const displayStatus = formatStatus(item.status, currentLang);

                let detailsHtml = '';
                let dataDetails = '';
                let dataCount = 0;
                if (item.details) {
                    detailsHtml = escapeHtml(item.details);
                    dataDetails = escapeHtml(item.details);
                } else if (item.history && item.history.length > 0) {
                    detailsHtml = `${item.history.length} ${I18N[currentLang].records}`;
                    dataCount = item.history.length;
                } else {
                    detailsHtml = I18N[currentLang].no_incidents;
                }

                let historyHtml = '';
                if (item.history && item.history.length > 0) {
                    const listItems = item.history.map(r => {
                        const isAuto = r.includes('[AUTOBAN-EXPIRED]');
                        const cls = isAuto ? ' class="autoban-entry"' : '';
                        return `<li${cls}>${escapeHtml(r)}</li>`;
                    }).join('');
                    historyHtml = `<div class="history-log"><h4 data-i18n="infraction_history">${I18N[currentLang].infraction_history}</h4><ul>${listItems}</ul></div>`;
                }

                let manualBtnHtml = '';
                if (item.manual_check_url) {
                    manualBtnHtml = `<div class="manual-check-container"><a href="${escapeHtml(item.manual_check_url)}" target="_blank" class="btn-manual" data-i18n="manual_check">${I18N[currentLang].manual_check}</a></div>`;
                }

                cardsHtml += `
                    <div class="card ${cardClass}">
                        <h3>${escapeHtml(item.source)}</h3>
                        <div class="status-badge" data-i18n-status data-original-status="${escapeHtml(item.status || '')}">${escapeHtml(displayStatus)}</div>
                        <p class="details" data-i18n-details data-details="${dataDetails}" data-count="${dataCount}">${detailsHtml}</p>
                        ${historyHtml}
                        ${manualBtnHtml}
                    </div>
                `;
            }

            const steamId2Html = player.steam_id2 ? `
                <span style="color: rgba(255,255,255,0.6); font-family: 'Roboto Mono', monospace; font-size: 0.85em;">
                    STEAM2: <span class="highlight">${escapeHtml(player.steam_id2)}</span>
                    <button type="button" class="btn-copy-id" onclick="copyToClipboard('${escapeHtml(player.steam_id2)}', this)">📋</button>
                </span>
            ` : '';

            const idRowHtml = `
                <div class="id-copy-row">
                    <span style="color: rgba(255,255,255,0.6); font-family: 'Roboto Mono', monospace; font-size: 0.85em;">
                        ID64: <span class="highlight">${escapeHtml(player.steam_id)}</span>
                        <button type="button" class="btn-copy-id" onclick="copyToClipboard('${escapeHtml(player.steam_id)}', this)">📋</button>
                    </span>
                    ${steamId2Html}
                </div>
            `;

            let metaBadgesHtml = '';
            if (player.privacy_state && player.privacy_state !== 'public') {
                metaBadgesHtml += `<span class="meta-badge meta-private" data-i18n="private_profile">${I18N[currentLang].private_profile}</span>`;
            }
            if (player.l4d2_hours) {
                metaBadgesHtml += `<span class="meta-badge meta-hours">🎮 ${escapeHtml(player.l4d2_hours)}h L4D2</span>`;
            } else if (player.privacy_state === 'public') {
                metaBadgesHtml += `<span class="meta-badge" data-i18n="hidden_hours">${I18N[currentLang].hidden_hours}</span>`;
            }
            if (player.member_since) {
                metaBadgesHtml += `<span class="meta-badge meta-age">📅 ${escapeHtml(player.member_since)}</span>`;
            }
            const metaRowHtml = metaBadgesHtml ? `<div class="player-meta-badges">${metaBadgesHtml}</div>` : '';

            let aliasesHtml = '';
            if (player.aliases && player.aliases.length > 0) {
                aliasesHtml = `
                    <div class="player-aliases">
                        <strong data-i18n="aliases_label">${I18N[currentLang].aliases_label}</strong>
                        <span>${player.aliases.map(a => escapeHtml(a)).join(', ')}</span>
                    </div>
                `;
            }

            section.innerHTML = `
                <header class="player-header">
                    <div class="header-info">
                        ${smurfBadgeHtml}
                        <div class="player-identity" style="display: flex; align-items: flex-start; gap: 15px;">
                            ${avatarHtml}
                            <div>
                                ${playerNameHtml}
                                ${idRowHtml}
                                ${metaRowHtml}
                                ${aliasesHtml}
                            </div>
                        </div>
                    </div>
                    <a href="${escapeHtml(player.profile_url)}" target="_blank" class="steam-link">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/8/83/Steam_icon_logo.svg" alt="Steam" width="20"> <span data-i18n="view_profile">${I18N[currentLang].view_profile}</span>
                    </a>
                </header>
                <div class="summary-grid">
                    ${cardsHtml}
                </div>
            `;

            return section;
        }

        form.addEventListener('submit', async function (e) {
            e.preventDefault();
            const inputVal = document.getElementById('steam-input').value.trim();

            if (!inputVal) return;

            // UI Switch
            searchContainer.style.display = 'none';
            newSearchContainer.style.display = 'block';
            progressView.style.display = 'block';
            progressList.innerHTML = '';
            liveResultsQueue.innerHTML = '';
            scannedPlayers = [];
            hideAutobansActive = false;
            liveResultsQueue.classList.remove('hide-autobans');
            if (lobbyToolbar) lobbyToolbar.style.display = 'none';
            statusText.setAttribute('data-status-key', 'status_connecting');
            statusText.innerText = I18N[currentLang].status_connecting;
            statusText.style.color = '#ff4444';
            profileInfo.style.display = 'none';

            let jobId = null;
            try {
                const resp = await fetch('/api/start_check', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ steam_input: inputVal, lang: currentLang })
                });
                const data = await resp.json();
                if (data.error) {
                    statusText.setAttribute('data-status-key', 'status_error_init');
                    statusText.innerText = I18N[currentLang].status_error_init;
                    const li = document.createElement('li');
                    li.style.color = 'red';
                    li.innerHTML = `❌ ${escapeHtml(data.error)}`;
                    progressList.appendChild(li);
                    return;
                }
                jobId = data.job_id;
            } catch (err) {
                console.error("Fetch Error:", err);
                jobId = encodeURIComponent(inputVal);
            }

            // Start Stream with lang query param fallback
            const evtSource = new EventSource("/stream_check/" + jobId + "?lang=" + currentLang);

            evtSource.onmessage = function (e) {
                const data = JSON.parse(e.data);

                if (data.type === 'info') {
                    if (data.name) {
                        profileName.innerText = data.name;
                        if (data.avatar) {
                            profileAvatar.src = data.avatar;
                            profileAvatar.style.display = 'inline-block';
                        } else {
                            profileAvatar.style.display = 'none';
                        }
                        profileInfo.style.display = 'block';
                        statusText.setAttribute('data-status-key', 'status_searching');
                        statusText.innerText = I18N[currentLang].status_searching;
                    }
                } else if (data.type === 'progress') {
                    const li = document.createElement('li');
                    li.innerHTML = `<span class="check-icon" style="color: yellow;">➜</span> ${escapeHtml(data.msg)}`;
                    progressList.appendChild(li);
                } else if (data.type === 'success') {
                    const li = document.createElement('li');
                    li.style.color = '#44ff44';
                    li.innerHTML = `<span class="check-icon">✔</span> ${escapeHtml(data.msg)}`;
                    progressList.appendChild(li);
                } else if (data.type === 'error') {
                    const li = document.createElement('li');
                    li.style.color = 'red';
                    li.innerHTML = `❌ ${escapeHtml(data.msg)}`;
                    progressList.appendChild(li);
                    evtSource.close();
                } else if (data.type === 'player_result') {
                    if (data.player) {
                        scannedPlayers.push(data.player);
                        if (lobbyToolbar) lobbyToolbar.style.display = 'flex';
                        updateLobbyCounters(scannedPlayers);

                        if (liveResultsQueue.children.length > 0) {
                            const hr = document.createElement('hr');
                            hr.className = 'player-separator';
                            liveResultsQueue.appendChild(hr);
                        }
                        const card = createPlayerCard(data.player);
                        liveResultsQueue.appendChild(card);
                    }
                } else if (data.type === 'complete' || data.type === 'redirect') {
                    statusText.setAttribute('data-status-key', 'status_complete');
                    statusText.innerText = I18N[currentLang].status_complete;
                    statusText.style.color = "#44ff44";
                    profileInfo.style.display = 'none';

                    if (data.url) {
                        try {
                            window.history.pushState({}, '', data.url);
                        } catch (err) {
                            console.log("pushState error", err);
                        }
                    }

                    const li = document.createElement('li');
                    li.style.color = '#44ff44';
                    li.setAttribute('data-i18n', 'all_completed');
                    li.innerHTML = I18N[currentLang].all_completed;
                    progressList.appendChild(li);

                    if (data.url) {
                        const permLi = document.createElement('li');
                        permLi.style.marginTop = '10px';
                        permLi.innerHTML = `<a href="${escapeHtml(data.url)}" style="color: #4fa8e6; text-decoration: underline;" data-i18n="perm_link">${I18N[currentLang].perm_link}</a>`;
                        progressList.appendChild(permLi);
                    }

                    evtSource.close();
                }
            };

            evtSource.onerror = function (e) {
                console.error("Stream Error", e);
                evtSource.close();
            };
        });

        // Initialize language
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const paramLang = params.get('lang');
            let initialLang = 'es';
            if (paramLang && (paramLang === 'es' || paramLang === 'en')) {
                initialLang = paramLang;
            } else {
                initialLang = localStorage.getItem('l4b_lang') || 'es';
            }
            setLanguage(initialLang);

            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    setLanguage(btn.getAttribute('data-lang'));
                });
            });

            const newSearchBtn = document.getElementById('btn-new-search');
            if (newSearchBtn) {
                newSearchBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    window.location.href = '/?lang=' + currentLang;
                });
            }

            // Toolbar action listeners
            const btnToggleAutobans = document.getElementById('btn-toggle-autobans');
            if (btnToggleAutobans) {
                btnToggleAutobans.addEventListener('click', () => {
                    hideAutobansActive = !hideAutobansActive;
                    liveResultsQueue.classList.toggle('hide-autobans', hideAutobansActive);
                    btnToggleAutobans.classList.toggle('active', hideAutobansActive);
                    btnToggleAutobans.innerText = hideAutobansActive
                        ? I18N[currentLang].toggle_autobans_show
                        : I18N[currentLang].toggle_autobans_hide;
                });
            }

            const btnCopyL4D2 = document.getElementById('btn-copy-l4d2');
            if (btnCopyL4D2) {
                btnCopyL4D2.addEventListener('click', () => {
                    const text = generateL4D2Report(scannedPlayers);
                    copyToClipboard(text, btnCopyL4D2);
                });
            }

            const btnCopyDiscord = document.getElementById('btn-copy-discord');
            if (btnCopyDiscord) {
                btnCopyDiscord.addEventListener('click', () => {
                    const text = generateDiscordReport(scannedPlayers);
                    copyToClipboard(text, btnCopyDiscord);
                });
            }
        });
    </script>
</body>

</html>
